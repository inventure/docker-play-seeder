name: Publish Seed Image

on:
  workflow_dispatch:

concurrency:
  group: publish-seed-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure run is against master
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "::error::This workflow can only be manually triggered against the master branch (got '${{ github.ref }}')."
            exit 1
          fi

  build-amd64:
    needs: verify-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Log in to DockerHub
        run: docker login -u${{ secrets.DOCKERHUB_USERNAME }} -p${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Log in to Docker Hardened Images registry
        run: docker login dhi.io -u${{ secrets.DOCKERHUB_USERNAME }} -p${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and publish amd64 image
        run: sbt "dockerSeed with-defaults docker-registry ${{ secrets.DOCKERHUB_PRIVATE_REGISTRY }}"

  build-arm64:
    needs: verify-branch
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Log in to DockerHub
        run: docker login -u${{ secrets.DOCKERHUB_USERNAME }} -p${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Log in to Docker Hardened Images registry
        run: docker login dhi.io -u${{ secrets.DOCKERHUB_USERNAME }} -p${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and publish arm64 image
        run: sbt "dockerSeed with-defaults docker-registry ${{ secrets.DOCKERHUB_PRIVATE_REGISTRY }}"

  publish-multiarch:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to DockerHub
        run: docker login -u${{ secrets.DOCKERHUB_USERNAME }} -p${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Create and push multiarch manifest
        run: |
          PRIVATE_REGISTRY="${{ secrets.DOCKERHUB_PRIVATE_REGISTRY }}"
          PUBLIC_REGISTRY="${{ secrets.DOCKERHUB_PUBLIC_REGISTRY }}"
          BASE_IMAGE=$(grep 'val baseImage' project/versions.scala | sed 's/.*"\(.*\)".*/\1/' | tr ':/' '-')
          PLAY=$(grep 'val playVersion' project/versions.scala | sed 's/.*"\(.*\)".*/\1/')
          SBT_VER=$(grep 'val sbtVersion' project/versions.scala | sed 's/.*"\(.*\)".*/\1/')
          SCALA=$(grep 'val scalaVersion' project/versions.scala | sed 's/.*"\(.*\)".*/\1/')
          SLICK=$(grep 'val playSlickVersion' project/versions.scala | sed 's/.*"\(.*\)".*/\1/')
          PRIVATE_BASE="${PRIVATE_REGISTRY}/play-dependencies-seed:play-${PLAY}-sbt-${SBT_VER}-scala-${SCALA}-play-slick-${SLICK}-${BASE_IMAGE}"
          MULTIARCH_TAG="${PUBLIC_REGISTRY}/play-dependencies-seed:play-${PLAY}-sbt-${SBT_VER}-scala-${SCALA}-play-slick-${SLICK}-${BASE_IMAGE}-multiarch"
          docker manifest create ${MULTIARCH_TAG} \
            --amend ${PRIVATE_BASE}-amd64 \
            --amend ${PRIVATE_BASE}-aarch64
          # The public registry tag is now mutable, so pushes always overwrite
          # rather than being rejected — any failure here is a real error.
          docker manifest push ${MULTIARCH_TAG}
